name: Chihuahua Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Neue Chihuahua-Version entpacken
        run: |
          unzip -o ChihuahuaMiniAssistant-Interaktiv.zip -d source

      - name: Android APK bauen
        working-directory: source/ChihuahuaMiniAssistant
        run: gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Chihuahua-Interaktiv-APK
          path: source/ChihuahuaMiniAssistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
