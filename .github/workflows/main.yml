name: Chihuahua Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: ZIP entpacken
        run: |
          unzip -o ChihuahuaMiniAssistant-AndroidBuild.zip -d source

            - name: Java- und Kotlin-Version angleichen
        working-directory: source/ChihuahuaMiniAssistant
        run: |
          sed -i '/android {/a\    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }' app/build.gradle.kts
          sed -i '/android {/a\    kotlinOptions {\n        jvmTarget = "17"\n    }' app/build.gradle.kts
          cat app/build.gradle.kts

      - name: Android-Projekt bauen
        working-directory: source/ChihuahuaMiniAssistant
        run: gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Chihuahua-Assistant-APK
          path: source/ChihuahuaMiniAssistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
