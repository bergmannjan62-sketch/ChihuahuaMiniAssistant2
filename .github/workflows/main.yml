
name: Chihuahua Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Chihuahua ZIP entpacken
        run: |
          unzip -o ChihuahuaMiniAssistant-Groq-Diagnose.zip -d source

      - name: Groq KI-Modell aktualisieren
        run: |
          echo "Suche bisherigen Groq-Modellnamen..."

          grep -rlZ 'llama-3.1-8b-instant' source/ChihuahuaMiniAssistant --include='*.kt' | xargs -0 -r sed -i 's/llama-3\.1-8b-instant/openai\/gpt-oss-20b/g'

          echo "Pruefe neuen Modellnamen..."
          grep -rn 'openai/gpt-oss-20b' source/ChihuahuaMiniAssistant --include='*.kt'

      - name: Android SDK pruefen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Android APK bauen
        working-directory: source/ChihuahuaMiniAssistant
        run: gradle assembleDebug --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Chihuahua-Groq-APK
          path: source/ChihuahuaMiniAssistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
