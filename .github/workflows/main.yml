
name: Chihuahua Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Animierten Chihuahua entpacken
        run: |
          unzip -o ChihuahuaMiniAssistant-Animiert.zip -d source

      - name: Groq KI-Modell aktualisieren
        run: |
          grep -rlZ 'llama-3.1-8b-instant' source/ChihuahuaMiniAssistant --include='*.kt' | xargs -0 -r sed -i 's/llama-3\.1-8b-instant/openai\/gpt-oss-20b/g'
          grep -rn 'openai/gpt-oss-20b' source/ChihuahuaMiniAssistant --include='*.kt'

      - name: Android APK bauen
        working-directory: source/ChihuahuaMiniAssistant
        run: gradle assembleDebug --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Chihuahua-Animiert-APK
          path: source/ChihuahuaMiniAssistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
