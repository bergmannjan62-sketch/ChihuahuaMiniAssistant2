name: Chihuahua Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Charly 7.0 entpacken
        run: |
          unzip -o ChihuahuaMiniAssistant-Charly-7-WhatsApp-Vision.zip -d source

      - name: Android APK bauen
        working-directory: source/ChihuahuaMiniAssistant
        run: gradle assembleDebug --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Charly-7-WhatsApp-Vision-APK
          path: source/ChihuahuaMiniAssistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
