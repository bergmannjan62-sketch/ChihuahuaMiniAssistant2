name: Chihuahua Android APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Repository herunterladen
    uses: actions/checkout@v4

  - name: Java einrichten
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: ZIP-Datei prüfen
    run: |
      ls -la
      unzip -l ChihuahuaMiniAssistant-AndroidBuild.zip
