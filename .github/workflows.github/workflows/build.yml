name: Build Chihuahua Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChihuahuaMiniAssistant-AndroidBuild.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o ChihuahuaMiniAssistant-AndroidBuild.zip -d project
          find project -maxdepth 4 -type f

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChihuahuaMiniAssistant-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
